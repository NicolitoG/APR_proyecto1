[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meteogym"
version = "0.1.0"
description = "Gymnasium environment for energy-aware satellite task availability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "gymnasium>=1.0,<2",
    "sgp4>=2.24,<3",
    "astropy>=7,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
plot = ["matplotlib>=3.9,<4", "pillow>=10"]

[project.scripts]
meteogym = "meteogym.cli:main"
meteogym-plot = "meteogym.plots.plot_results:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meteogym*"]

[tool.setuptools.package-data]
meteogym = ["data/*.tle", "data/*.json", "data/*.md", "data/*.txt"]
"meteogym.plots" = ["data/*.geojson", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
